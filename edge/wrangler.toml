# wrangler.toml — Cloudflare Workers deploy config (SPEC-49 / v3 build spec)
name = "patala"
main = "worker.js"
compatibility_date = "2026-01-01"

# routes: serve static via CDN, /api and /mcp via the Worker
routes = [
  { pattern = "patala.org", zone_name = "patala.org" },
  { pattern = "patala.org/api/*", zone_name = "patala.org" },
  { pattern = "patala.org/mcp", zone_name = "patala.org" },
]

# R2 bucket = the immutable compiled site (compute-on-write)
[[r2_buckets]]
binding = "R2"
bucket_name = "patala-site"

# KV = the filename -> content-hash alias map (reactive: alias moves, bytes immutable)
[[kv_namespaces]]
binding = "KV"
id = "9be289b9b7a64a5a90b472eb0e855ef6"

[assets]
directory = "../site"   # the static site built by build-static-site.py
binding = "ASSETS"

# performance: hyperdrive for the DB only where genuinely needed
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "..."

# [vars]
# ALGOLIA_APP_ID = "..."
